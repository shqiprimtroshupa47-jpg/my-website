<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Champedia | The World Champions Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- DESIGN SYSTEM TOKENS & RESET --- */
        :root {
            --bg-main: #090d16;
            --bg-card: #111827;
            --bg-sidebar: #0d131f;
            --text-primary: #f9fafb;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --border-color: #1f2937;
            --infobox-bg: #1f2937;
            --accent-red: #ef4444;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --font-serif: 'Lora', Georgia, serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-sans);
            height: 100vh;
            overflow: hidden;
        }

        /* Utility Hidden State Guard */
        .hidden {
            display: none !important;
        }

        /* --- SCREEN 1: CORE AUTHENTICATION UI --- */
        .auth-container {
            align-items: center;
            background-color: var(--bg-main);
            display: flex;
            height: 100vh;
            justify-content: center;
            left: 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 500;
        }

        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            padding: 2.5rem;
            width: 90%;
            animation: fadeIn 0.4s ease;
        }

        .auth-logo {
            justify-content: center;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .auth-toggle-header {
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .auth-tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 1rem;
            font-weight: 600;
            padding-bottom: 0.75rem;
            position: relative;
            transition: color 0.2s ease;
        }

        .auth-tab-btn.active {
            color: var(--accent-blue);
        }

        .auth-tab-btn.active::after {
            background-color: var(--accent-blue);
            bottom: -1px;
            content: '';
            height: 2px;
            left: 0;
            position: absolute;
            width: 100%;
        }

        .auth-form {
            display: none;
            flex-direction: column;
            gap: 1.25rem;
        }

        .auth-form.active {
            display: flex;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .form-group label {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .form-control {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            padding: 0.75rem 1rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn-auth {
            background-color: var(--accent-blue);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 0.5rem;
            padding: 0.85rem;
            transition: background-color 0.2s;
        }

        .btn-auth:hover {
            background-color: var(--accent-blue-hover);
        }

        .auth-error-text {
            color: var(--accent-red);
            font-size: 0.85rem;
            font-weight: 500;
            margin-top: 1.25rem;
            text-align: center;
            min-height: 20px;
        }

        /* --- SCREEN 2: MAIN WORKSPACE MAIN FRAME --- */
        .wiki-container {
            display: grid;
            grid-template-columns: 280px 1fr;
            height: 100vh;
        }

        .wiki-sidebar {
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            padding: 2rem 1.5rem;
            overflow-y: auto;
        }

        .wiki-logo {
            align-items: center;
            display: flex;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--accent-blue), #60a5fa);
            border-radius: 6px;
            color: #ffffff;
            font-weight: 700;
            height: 32px;
            width: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .section-title {
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
        }

        .category-menu {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .cat-btn {
            background: none;
            border: none;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 500;
            padding: 0.7rem 1rem;
            text-align: left;
            transition: all 0.2s ease;
        }

        .cat-btn:hover, .cat-btn.active {
            background-color: var(--bg-card);
            color: var(--text-primary);
        }

        .cat-btn.active {
            color: var(--accent-blue);
            font-weight: 600;
            border-left: 3px solid var(--accent-blue);
            border-radius: 0 8px 8px 0;
        }

        .bookmark-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .bookmark-item {
            color: var(--accent-blue);
            cursor: pointer;
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding: 0.4rem 0.5rem;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .bookmark-item:hover {
            background-color: var(--bg-card);
            text-decoration: underline;
        }

        .user-meta-profile {
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            padding-top: 1.25rem;
        }

        .user-meta-info {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        #user-display-name {
            font-size: 0.95rem;
            font-weight: 700;
        }

        .btn-logout {
            background: none;
            border: none;
            color: var(--accent-red);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            text-align: left;
            width: fit-content;
        }

        .btn-logout:hover {
            text-decoration: underline;
        }

        .wiki-main {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .wiki-header {
            background-color: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 2.5rem;
            min-height: 75px;
        }

        .search-bar-wrapper {
            align-items: center;
            display: flex;
            position: relative;
            width: 45%;
        }

        .search-icon {
            color: var(--text-muted);
            position: absolute;
            left: 1.2rem;
            pointer-events: none;
        }

        #wikiSearch {
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            padding: 0.75rem 1rem 0.75rem 3rem;
            width: 100%;
            transition: all 0.2s ease;
        }

        #wikiSearch:focus {
            background-color: var(--bg-card);
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .btn-random {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-primary);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            transition: all 0.2s;
        }

        .btn-random:hover {
            background-color: var(--border-color);
        }

        .wiki-workspace {
            flex-grow: 1;
            overflow-y: auto;
            padding: 2.5rem;
        }

        .workspace-screen {
            display: none;
        }

        .workspace-screen.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .view-header {
            margin-bottom: 2.5rem;
        }

        .view-header h2 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-top: 0.35rem;
        }

        .wiki-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.75rem;
        }

        .wiki-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.75rem;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .wiki-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
            border-color: #4b5563;
        }

        .card-top span {
            color: var(--accent-blue);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-top h3 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-top: 0.35rem;
            letter-spacing: -0.01em;
        }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin: 1.25rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer-era {
            color: var(--text-primary);
            font-size: 0.85rem;
            font-weight: 600;
            border-top: 1px solid var(--border-color);
            padding-top: 1rem;
            margin-top: auto;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 2rem;
            transition: color 0.2s;
        }

        .btn-back:hover { color: var(--text-primary); }

        .document-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1.5rem;
        }

        #docCategory {
            color: var(--accent-blue);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #docTitle {
            font-family: var(--font-serif);
            font-size: 2.75rem;
            font-weight: 500;
            margin: 0.35rem 0;
            letter-spacing: -0.02em;
        }

        .doc-sub {
            color: var(--text-muted);
            font-style: italic;
            font-size: 1.05rem;
        }

        .btn-bookmark-action {
            background-color: var(--accent-blue);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.65rem 1.25rem;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-bookmark-action:hover { background-color: var(--accent-blue-hover); }
        .btn-bookmark-action.active { background-color: #4b5563; }

        .wiki-divider {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 2rem 0;
        }

        .document-body {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 3.5rem;
        }

        .document-text p {
            font-family: var(--font-serif);
            font-size: 1.15rem;
            line-height: 1.8;
            margin-bottom: 1.75rem;
            color: #e5e7eb;
        }

        .document-infobox {
            background-color: var(--bg-sidebar);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            align-self: flex-start;
        }

        .infobox-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .infobox-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            padding: 0.65rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .infobox-label {
            color: var(--text-muted);
            font-weight: 600;
            width: 40%;
        }

        .infobox-value {
            font-weight: 500;
            width: 60%;
            text-align: right;
            color: #f3f4f6;
        }

        @media (max-width: 1024px) {
            .document-body { grid-template-columns: 1fr; gap: 2.5rem; }
            .document-infobox { width: 100%; order: -1; }
        }

        @media (max-width: 768px) {
            .wiki-container { grid-template-columns: 1fr; }
            .wiki-sidebar { display: none; }
            .search-bar-wrapper { width: 65%; }
            .document-header { flex-direction: column; align-items: flex-start; }
            .btn-bookmark-action { width: 100%; text-align: center; margin-top: 1rem; }
        }
    </style>
</head>

    <!-- SCREEN 1: PORTAL AUTHORIZATION DECK -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="logo-icon">W</div>
                <span>CHAMPEDIA</span>
            </div>
            
            <div class="auth-toggle-header">
                <button id="toggle-signin-tab" class="auth-tab-btn active">Sign In</button>
                <button id="toggle-signup-tab" class="auth-tab-btn">Sign Up</button>
            </div>

            <!-- Sign In Portal Form View -->
            <form id="signInForm" class="auth-form active">
                <div class="form-group">
                    <label for="signin-email">Email Address</label>
                    <input type="email" id="signin-email" required class="form-control" placeholder="champion@world.com">
                </div>
                <div class="form-group">
                    <label for="signin-password">Password</label>
                    <input type="password" id="signin-password" required class="form-control" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-auth">Enter Archive Portal</button>
            </form>

            <!-- Sign Up Database Registration Form View -->
            <form id="signUpForm" class="auth-form">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" required class="form-control" placeholder="Alexander Vance">
                </div>
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" required class="form-control" placeholder="champion@world.com">
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required class="form-control" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-auth">Create Master Account</button>
            </form>
            
            <p id="auth-error-msg" class="auth-error-text"></p>
        </div>
    </div>

    <!-- SCREEN 2: ENCYCLOPEDIA WORKSPACE FRAME -->
    <div id="app-screen" class="wiki-container hidden">
        <aside class="wiki-sidebar">
            <div class="wiki-logo">
                <div class="logo-icon">W</div>
                <span>CHAMPEDIA</span>
            </div>
            
            <div class="sidebar-section">
                <h4 class="section-title">Portals</h4>
                <div class="category-menu" id="categoryMenu">
                    <button class="cat-btn active" data-category="all">All Disciplines</button>
                    <button class="cat-btn" data-category="Motorsports">Motorsports</button>
                    <button class="cat-btn" data-category="Chess">Chess & Mind</button>
                    <button class="cat-btn" data-category="Athletics">Athletics</button>
                    <button class="cat-btn" data-category="Combat Sports">Combat Sports</button>
                </div>
            </div>

            <div class="sidebar-section bookmark-section">
                <h4 class="section-title">Saved Reading List (<span id="bookmark-count">0</span>)</h4>
                <div class="bookmark-list" id="bookmarkList"></div>
            </div>

            <div class="user-meta-profile">
                <div class="user-meta-info">
                    <span id="user-display-name">Active User</span>
                    <button id="logoutBtn" class="btn-logout">Disconnect Portal</button>
                </div>
            </div>
        </aside>

        <main class="wiki-main">
            <header class="wiki-header">
                <div class="search-bar-wrapper">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="wikiSearch" placeholder="Search champion records, histories, eras...">
                </div>
                <button class="btn-random" id="randomArticleBtn">🎲 Random Article</button>
            </header>

            <div class="wiki-workspace">
                <section id="directory-view" class="workspace-screen active">
                    <div class="view-header">
                        <h2>World Champion Directory</h2>
                        <p class="subtitle" id="results-count">Loading archive dataset records...</p>
                    </div>
                    <div class="wiki-grid" id="wikiGrid"></div>
                </section>

                <section id="article-view" class="workspace-screen">
                    <button class="btn-back" id="backToDirectoryBtn">← Back to Archive Directory</button>
                    <article class="wiki-document">
                        <header class="document-header">
                            <div class="header-main-info">
                                <span class="doc-badge" id="docCategory">Category</span>
                                <h1 id="docTitle">Champion Profile Title</h1>
                                <p class="doc-sub" id="docEra">Active Tenure</p>
                            </div>
                            <button class="btn-bookmark-action" id="toggleBookmarkBtn">Bookmark Article</button>
                        </header>
                        <hr class="wiki-divider">
                        <div class="document-body">
                            <div class="document-text" id="docBody"></div>
                            <aside class="document-infobox" id="docInfoBox"></aside>
                        </div>
                    </article>
                </section>
            </div>
        </main>
    </div>

                era: "1964 – 1979",
                excerpt: "Inspirational three-time World Heavyweight Boxing Champion and cultural icon universally hailed as 'The Greatest' of the 20th century ring space.",
                description: "<p>Muhammad Ali was an American professional boxer and activist. Nicknamed 'The Greatest', he is widely regarded as one of the most significant and celebrated sports figures of the 20th century, and is frequently ranked as the greatest heavyweight boxer of all time.</p><p>He won the world heavyweight championship from Sonny Liston in a major upset in 1964 at age 22. Ali remains the only three-time lineal champion of that division, famously defending his crown in legendary bouts like the 'Rumble in the Jungle' and 'Thrilla in Manila'.</p>",
                stats: { "Heavyweight Titles": "3 Time", "Total Wins": "56", "Nationality": "American", "Career Losses": "5" }
            }
        ];

        function generate1000Champions() {
            const categories = ["Motorsports", "Chess", "Athletics", "Combat Sports"];
            const firstNames = ["Alexander", "Elena", "Marcus", "Kenji", "Carlos", "Aisha", "Viktor", "Chloe", "Devon", "Sonia", "Hans", "Matteo", "Naomi", "Tariq", "Serena"];
            const lastNames = ["Vance", "Gomez", "Sato", "Ivanov", "Dryden", "Müller", "Russo", "Chen", "Nkosi", "O'Connor", "Kim", "Jordan", "Al-Farsi", "Silva"];
            const techniques = ["unmatched tactical precision", "aggressive defensive maneuvers", "flawless psychological execution", "unprecedented explosive power", "meticulous strategic plotting"];
            
            const completeDataset = [...baseArticles];

            for (let i = 1; i <= 996; i++) {
                const firstName = firstNames[Math.floor(Math.random() * firstNames.length)];
                const lastName = lastNames[Math.floor(Math.random() * lastNames.length)];
                const fullName = `${firstName} ${lastName} No. ${i}`;
                const category = categories[Math.floor(Math.random() * categories.length)];
                
                const startYear = 1950 + (i % 75);
                const endYear = startYear + 3 + (i % 12);
                const era = `${startYear} – ${endYear}`;
                
                const titlesCount = (i % 6) + 1;
                const victories = (i * 3) + 14;
                const id = `champ-${i}`;
                const excerpt = `Distinguished ${category} World Champion who dominated the ${startYear}s era using ${techniques[i % techniques.length]} to break long-standing competitive records.`;
                
                const description = `
                    <p>${fullName} is an elite historical competitor in the field of ${category}. Over a professional career spanning from ${startYear} to ${endYear}, this athlete rewrote modern competitive dynamics using a hallmark approach defined by ${techniques[i % techniques.length]}.</p>
                    <p>During their historic peak runtime, they successfully secured a total of ${titlesCount} World Championship titles, defending their standing position against multiple legendary generation challengers and setting standard benchmarks that remain highly analyzed by modern sports analysts today.</p>
                `;

                completeDataset.push({
                    id: id,
                    name: fullName,
                    category: category,
                    era: era,
                    excerpt: excerpt,
                    description: description,
                    stats: {
                        "World Titles": titlesCount.toString(),
                        "Career Wins": victories.toString(),
                        "Historic Era": era,
                        "Archive ID": `#CP-${1000 + i}`
                    }
                });
            }
            return completeDataset;
        }

        const articlesDataset = generate1000Champions();

        let appState = {
            activeCategory: "all",
            searchQuery: "",
            currentArticleId: null,
            bookmarks: JSON.parse(localStorage.getItem('wiki_bookmarks')) || [],
            currentUser: JSON.parse(localStorage.getItem('wiki_current_user')) || null
        };

        const dom = {
            authScreen: document.getElementById('auth-screen'),
            appScreen: document.getElementById('app-screen'),
            directoryScreen: document.getElementById('directory-view'),
            articleScreen: document.getElementById('article-view'),
            tabSignIn: document.getElementById('toggle-signin-tab'),
            tabSignUp: document.getElementById('toggle-signup-tab'),
            signInForm: document.getElementById('signInForm'),
            signUpForm: document.getElementById('signUpForm'),
            authError: document.getElementById('auth-error-msg'),
            logoutBtn: document.getElementById('logoutBtn'),
            userDisplayName: document.getElementById('user-display-name'),
            grid: document.getElementById('wikiGrid'),
            search: document.getElementById('wikiSearch'),
            categoryMenu: document.getElementById('categoryMenu'),
            resultsCount: document.getElementById('results-count'),
            randomBtn: document.getElementById('randomArticleBtn'),
            backBtn: document.getElementById('backToDirectoryBtn'),
            docCategory: document.getElementById('docCategory'),
            docTitle: document.getElementById('docTitle'),
            docEra: document.getElementById('docEra'),
            docBody: document.getElementById('docBody'),
            docInfoBox: document.getElementById('docInfoBox'),
            bookmarkBtn: document.getElementById('toggleBookmarkBtn'),
            bookmarkList: document.getElementById('bookmarkList'),
            bookmarkCount: document.getElementById('bookmark-count')
        };

        /** --- GATEKEEPER AUTHORIZATION CONTROL ROUTER --- */
        function handleAuthRouting() {
            if (appState.currentUser) {
                dom.authScreen.classList.add('hidden');
                dom.appScreen.classList.remove('hidden');
                dom.userDisplayName.textContent = appState.currentUser.name;
                updateUI();
            } else {
                dom.appScreen.classList.add('hidden');
                dom.authScreen.classList.remove('hidden');
            }
        }

        dom.tabSignIn.addEventListener('click', () => {
            dom.tabSignUp.classList.remove('active');
            dom.tabSignIn.classList.add('active');
            dom.signUpForm.classList.remove('active');
            dom.signInForm.classList.add('active');
            dom.authError.textContent = "";
        });

        dom.tabSignUp.addEventListener('click', () => {
            dom.tabSignIn.classList.remove('active');
            dom.tabSignUp.classList.add('active');
            dom.signInForm.classList.remove('active');
            dom.signUpForm.classList.add('active');
            dom.authError.textContent = "";
        });

        dom.signUpForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;

            let users = JSON.parse(localStorage.getItem('wiki_registered_users')) || [];
            if (users.some(u => u.email === email)) {
                dom.authError.textContent = "Account email already exists inside database.";
                return;
            }

            const newUser = { name, email, password };
            users.push(newUser);
            localStorage.setItem('wiki_registered_users', JSON.stringify(users));
            
            appState.currentUser = { name: newUser.name, email: newUser.email };
            localStorage.setItem('wiki_current_user', JSON.stringify(appState.currentUser));
            
            dom.signUpForm.reset();
            handleAuthRouting();
        });

        dom.signInForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('signin-email').value;
            const password = document.getElementById('signin-password').value;

            const users = JSON.parse(localStorage.getItem('wiki_registered_users')) || [];
            const matchedUser = users.find(u => u.email === email && u.password === password);

            if (!matchedUser) {
                dom.authError.textContent = "Invalid credential combinations.";
                return;
            }

            appState.currentUser = { name: matchedUser.name, email: matchedUser.email };
            localStorage.setItem('wiki_current_user', JSON.stringify(appState.currentUser));
            
            dom.signInForm.reset();
            handleAuthRouting();
        });

        dom.logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('wiki_current_user');
            appState.currentUser = null;
            closeArticleView();
            handleAuthRouting();
        });

        /** --- INTERFACE PROCESSING RENDERING FLOW --- */
        function updateUI() {
            dom.grid.innerHTML = '';
            
            const filtered = articlesDataset.filter(article => {
                const matchesCategory = appState.activeCategory === 'all' || article.category === appState.activeCategory;
                const matchesSearch = article.name.toLowerCase().includes(appState.searchQuery.toLowerCase()) || 
                                      article.excerpt.toLowerCase().includes(appState.searchQuery.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            dom.resultsCount.textContent = `Showing ${filtered.length} champion index profiles`;

            filtered.forEach(art => {
                const card = document.createElement('div');
                card.className = 'wiki-card';
                card.innerHTML = `
                    <div class="card-top">
                        <span>${art.category}</span>
                        <h3>${art.name}</h3>
                    </div>
                    <p class="card-desc">${art.excerpt}</p>
                    <div class="card-footer-era">${art.era}</div>
                `;
                card.addEventListener('click', () => openArticle(art.id));
                dom.grid.appendChild(card);
            });

            renderBookmarksPanel();
        }

        function openArticle(id) {
            const article = articlesDataset.find(a => a.id === id);
            if (!article) return;

            appState.currentArticleId = id;
            dom.docCategory.textContent = article.category;
            dom.docTitle.textContent = article.name;
            dom.docEra.textContent = `Championship Tenure: ${article.era}`;
            dom.docBody.innerHTML = article.description;

            let infoBoxHTML = `<div class="infobox-title">${article.name}</div>`;
            for (const [label, value] of Object.entries(article.stats)) {
                infoBoxHTML += `
                    <div class="infobox-row">
                        <span class="infobox-label">${label}</span>
                        <span class="infobox-value">${value}</span>
                    </div>
                `;
            }
            dom.docInfoBox.innerHTML = infoBoxHTML;

            updateBookmarkButtonState();
            dom.directoryScreen.classList.remove('active');
            dom.articleScreen.classList.add('active');
            document.querySelector('.wiki-main').scrollTop = 0;
        }

        function closeArticleView() {
            dom.articleScreen.classList.remove('active');
            dom.directoryScreen.classList.add('active');
            appState.currentArticleId = null;
        }

        function toggleBookmark() {
            const id = appState.currentArticleId;
            if (!id) return;

            if (appState.bookmarks.includes(id)) {
                appState.bookmarks = appState.bookmarks.filter(b => b !== id);
            } else {
                appState.bookmarks.push(id);
            }

            localStorage.setItem('wiki_bookmarks', JSON.stringify(appState.bookmarks));
            updateBookmarkButtonState();
            renderBookmarksPanel();
        }

        function updateBookmarkButtonState() {
            if (appState.bookmarks.includes(appState.currentArticleId)) {
                dom.bookmarkBtn.textContent = "✓ Saved in Reading List";
                dom.bookmarkBtn.classList.add('active');
            } else {
                dom.bookmarkBtn.textContent = "Bookmark Article";
                dom.bookmarkBtn.classList.remove('active');
            }
        }

        function renderBookmarksPanel() {
            dom.bookmarkList.innerHTML = '';
            dom.bookmarkCount.textContent = appState.bookmarks.length;

            if (appState.bookmarks.length === 0) {
                dom.bookmarkList.innerHTML = '<span style="font-size:0.85rem; color:var(--text-muted); font-style:italic;">No saved articles</span>';
                return;
            }

            appState.bookmarks.forEach(id => {
                const article = articlesDataset.find(a => a.id === id);
                if (article) {
                    const item = document.createElement('div');
                    item.className = 'bookmark-item';
                    item.textContent = article.name;
                    item.addEventListener('click', () => openArticle(id));
                    dom.bookmarkList.appendChild(item);
                }
            });
        }

        /** --- EVENT HANDLERS DECK ENGINE PIPES --- */
        dom.search.addEventListener('input', (e) => {
            appState.searchQuery = e.target.value;
            if (appState.currentArticleId) closeArticleView();
            updateUI();
        });

        dom.categoryMenu.addEventListener('click', (e) => {
            const button = e.target.closest('.cat-btn');
            if (!button) return;

            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');

            appState.activeCategory = button.getAttribute('data-category');
            if (appState.currentArticleId) closeArticleView();
            updateUI();
        });

        dom.backBtn.addEventListener('click', closeArticleView);
        dom.bookmarkBtn.addEventListener('click', toggleBookmark);

        dom.randomBtn.addEventListener('click', () => {
            const randomIndex = Math.floor(Math.random() * articlesDataset.length);
            openArticle(articlesDataset[randomIndex].id);
        });

        document.addEventListener('DOMContentLoaded', handleAuthRouting);
    </script>
</body>
</html>
